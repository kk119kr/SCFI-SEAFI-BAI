name: collect-freight-index

on:
  schedule:
    # GitHub 예약은 UTC 기준. 한국시간(KST) = UTC+9
    - cron: "0 1 * * 2"   # 화 10:00 KST  (BAI: 월요일 기준 주간값)
    - cron: "0 1 * * 3"   # 수 10:00 KST  (BAI 재시도)
    - cron: "0 9 * * 5"   # 금 18:00 KST  (SCFI·SEAFI: 금요일 발표)
    - cron: "0 1 * * 6"   # 토 10:00 KST  (SCFI·SEAFI 재시도)
  workflow_dispatch: {}    # Actions 탭에서 [Run workflow] 버튼으로 수동 실행

permissions:
  contents: write          # data/ 파일을 저장소에 다시 저장하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집 프로그램은 표준 라이브러리만 쓰므로 별도 설치가 없다.
      - name: 지수 수집
        id: collect
        run: python scripts/collect.py
        continue-on-error: true   # 실패해도 수집 기록(data/collect_log.csv)은 저장한 뒤 아래에서 실패 처리

      # 매 실행마다 collect_log.csv에 한 줄이 추가되므로 저장소 활동이 계속 생겨,
      # 공개 저장소의 '60일 무활동 시 예약 실행 중지'를 막아 준다.
      - name: 데이터 저장
        run: |
          git config user.name "freight-index-bot"
          git config user.email "freight-index-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 수집 결과"
          git push

      - name: 수집 실패·경고 시 실행을 실패로 표시(알림 대상)
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집에 실패했거나 경고가 있습니다. data/collect_log.csv 마지막 줄을 확인하세요."
          exit 1
