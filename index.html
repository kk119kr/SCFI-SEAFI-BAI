<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운임지수 현황</title>
<style>
:root{--navy:#003766;--sky:#5BB3E5;--ink:#1c2733;--mute:#66727f;--line:#dfe5ec;--bg:#f3f6fa;--up:#b3261e;--down:#1b5e9b;--warn:#c27a00}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:-.2px}
header .meta{margin-left:auto;font-size:12.5px;opacity:.85}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #c5cfda;border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 13px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid #c5cfda}
.seg button.on{background:var(--navy);color:#fff}
.bar label{color:var(--mute);font-size:12.5px}
.bar input[type=date]{font:inherit;padding:5px 8px;border:1px solid #c5cfda;border-radius:7px}
main{padding:16px 24px 28px;max-width:1900px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c,var(--navy));border-radius:10px;padding:12px 16px}
.card h3{margin:0;font-size:13px;color:var(--mute);font-weight:600}
.card .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0}
.card .asof{font-size:12px;color:var(--mute)}
.card .deltas{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.d{font-size:12px;color:var(--mute)}
.d b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.hl{font-size:12px;color:var(--mute);margin-top:6px}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px 8px;position:relative}
.panel h2{margin:0 0 4px;font-size:14px}
.panel .sub{font-size:11.5px;color:var(--mute)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:rgba(0,30,60,.94);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;display:none;z-index:5;line-height:1.5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:2px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{background:#f0f4f8;font-weight:600;color:var(--mute);position:sticky;top:0}
.tablewrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid #c5cfda;background:#fff;border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer}
.btn:hover{background:#f0f4f8}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.warn{color:var(--warn)}
.ok{color:#1b7a3d}.bad{color:var(--up)}
footer{font-size:12px;color:var(--mute)}
.src a{color:var(--navy)}
#err{display:none;margin:20px 24px;padding:14px;background:#fff3f2;border:1px solid #f0c4c0;border-radius:8px}
@media (max-width:1100px){.cards,.charts,.row2{grid-template-columns:1fr}}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff;font-size:11px}.bar,.btn,#more{display:none!important}.tablewrap{max-height:none}.panel,.card{break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header>
  <h1>운임지수 현황</h1>
  <span>BAI · SCFI · SEAFI</span>
  <span class="meta" id="meta">불러오는 중…</span>
</header>
<div class="bar" id="controls">
  <span class="seg" id="quick"></span>
  <span><label>시작일 </label><input type="date" id="from"></span>
  <span><label>종료일 </label><input type="date" id="to"></span>
  <span class="seg" id="unit"></span>
  <button class="btn" id="fetchBtn" style="background:var(--navy);color:#fff;border-color:var(--navy)">최신값 가져오기</button>
  <button class="btn" onclick="window.print()">인쇄 / PDF</button>
  <span class="sub" id="fetchMsg"></span>
</div>
<div id="err"></div>
<main id="app" style="display:none">
  <section class="cards" id="cards"></section>
  <section class="charts" id="charts"></section>
  <section class="row2">
    <div class="panel"><h2>상대 비교 <span class="sub" id="cmpSub"></span></h2><div class="legend" id="cmpLegend"></div><div id="cmp"></div></div>
    <div class="panel"><h2 id="rirTitle">참고 지수</h2><div id="rir"></div><div class="note" id="rirNote"></div></div>
  </section>
  <section class="panel" style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><h2 style="margin:0">데이터 표</h2><span class="sub" id="tblSub"></span><span style="margin-left:auto"><button class="btn" id="dl">선택 기간 CSV 내려받기</button></span></div>
    <div class="tablewrap"><table><thead><tr><th>기준일</th><th>지수</th><th>값</th><th id="chgH">전기 대비</th><th>주기</th><th>표시</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div style="margin-top:8px"><button class="btn" id="more">더 보기</button></div>
  </section>
  <section class="panel" style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <h2 style="margin:0">원자료 (엑셀용)</h2><span class="sub" id="rawSub"></span>
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="rawCopy">복사 (엑셀에 붙여넣기)</button>
        <button class="btn" id="rawXlsx" style="background:var(--navy);color:#fff;border-color:var(--navy)">엑셀 파일(.xlsx) 내려받기</button>
      </span>
    </div>
    <div class="note" style="margin:0 0 8px">선택한 기간의 원본 주간값입니다. 월~일을 한 주로 묶어 BAI·SCFI·SEAFI를 한 줄에 놓았고, 각 지수의 실제 기준일은 오른쪽 열에 있습니다. 엑셀 파일에는 이 표(가로)와 지수별 원본(세로, 메모 포함) 두 시트가 들어 있습니다.</div>
    <div class="tablewrap" style="max-height:300px"><table id="rawTbl"><thead></thead><tbody></tbody></table></div>
    <div class="note" id="rawMsg"></div>
  </section>
  <section class="panel" style="margin-top:14px">
    <h2>수집 현황</h2><div id="status" class="note" style="margin-top:0"></div><div class="note src" id="src"></div>
  </section>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
// ───────── 설정 ─────────
const DAY = 86400000;
const $ = id => document.getElementById(id);
const state = {unit:"W", from:null, to:null, rows:[], idx:[], log:[], shown:60};

// ───────── CSV 읽기 ─────────
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const out=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(f); f=""; if(row.length>1||row[0]!=="")out.push(row); row=[]; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); out.push(row); }
  const h=out.shift();
  return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])));
}
async function load(name, optional){
  try{ const r=await fetch(name+"?v="+Date.now()); if(!r.ok) throw new Error(r.status); return parseCSV(await r.text()); }
  catch(e){ if(optional) return []; throw e; }
}

// ───────── 날짜·숫자 도우미 ─────────
const t = s => Date.parse(s+"T00:00:00Z");
const iso = ms => new Date(ms).toISOString().slice(0,10);
const fmt = (v,d=2) => v==null?"-":v.toLocaleString("ko-KR",{maximumFractionDigits:d});
const pct = (a,b) => (b==null||b===0||a==null)?null:(a/b-1)*100;
function pctHTML(p){
  if(p==null) return '<b class="flat">-</b>';
  const cls=p>0.005?"up":p<-0.005?"down":"flat", ar=p>0.005?"▲":p<-0.005?"▼":"–";
  return `<b class="${cls}">${ar} ${p>0?"+":""}${p.toFixed(1)}%</b>`;
}
const monthKey = ms => iso(ms).slice(0,7), yearKey = ms => iso(ms).slice(0,4);

// ───────── 데이터 가공 ─────────
function seriesOf(code){
  return state.rows.filter(r=>r.index_code===code).map(r=>({t:t(r.date),date:r.date,v:parseFloat(r.value),freq:r.frequency,flag:r.flag,note:r.note,origin:r.origin}))
    .filter(p=>!isNaN(p.v)).sort((a,b)=>a.t-b.t);
}
function inRange(pts){ return pts.filter(p=>p.t>=state.from && p.t<=state.to+DAY-1); }
// 보기 단위에 맞춘 점 목록: 주간=원본, 월간/연간=구간 평균
function view(code){
  const raw = inRange(seriesOf(code));
  if(state.unit==="W") return raw.map(p=>({...p,label:p.date}));
  const keyf = state.unit==="M"?monthKey:yearKey, g=new Map();
  for(const p of raw){ const k=keyf(p.t); if(!g.has(k)) g.set(k,[]); g.get(k).push(p); }
  const all = seriesOf(code), lastAll = all.length?all[all.length-1].t:0;
  return [...g.entries()].map(([k,a])=>{
    const v=a.reduce((s,p)=>s+p.v,0)/a.length;
    const open = keyf(lastAll)===k && keyf(Date.now())===k;
    const t0 = state.unit==="M"?t(k+"-01"):t(k+"-01-01");
    return {t:t0,date:k,v,n:a.length,freq:a.every(p=>p.freq==="M")?"M":"W",flag:a.some(p=>p.flag==="확인필요")?"확인필요":"정상",
            label:k+(open?" (진행중)":"")+" 평균",open};
  });
}

// ───────── 차트(SVG, 외부 라이브러리 없음) ─────────
function niceTicks(min,max,n=4){
  const span=max-min||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||raw;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, a=[];
  for(let v=lo;v<=hi+step/2;v+=step) a.push(+v.toFixed(6));
  return a;
}
function lineChart(el, series, o={}){
  const W=o.w||640,H=o.h||260,m={l:54,r:14,t:10,b:26};
  const pts=series.flatMap(s=>s.points);
  if(!pts.length){ el.innerHTML='<div class="note" style="padding:40px 0;text-align:center">선택 기간에 데이터가 없습니다.</div>'; return; }
  let x0=Math.min(...pts.map(p=>p.t)), x1=Math.max(...pts.map(p=>p.t)); if(x0===x1){x0-=3*DAY;x1+=3*DAY}
  let lo=Math.min(...pts.map(p=>p.v)), hi=Math.max(...pts.map(p=>p.v)); const pad=(hi-lo||hi*.1||1)*.08; lo-=pad; hi+=pad;
  const ticks=niceTicks(lo,hi,o.nt||4), y0=ticks[0], y1=ticks[ticks.length-1];
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let g="";
  for(const tk of ticks) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="#e6ebf1"/><text x="${m.l-6}" y="${Y(tk)+4}" text-anchor="end" font-size="11" fill="#66727f">${fmt(tk,o.dec??1)}</text>`;
  // x축 눈금
  const nx=Math.min(6,Math.max(2,Math.floor((W-m.l-m.r)/110)));
  for(let i=0;i<=nx;i++){ const tv=x0+(x1-x0)*i/nx; const d=iso(tv);
    const lab = state.unit==="Y"?d.slice(0,4):(x1-x0>800*DAY?d.slice(0,7):d.slice(2));
    g+=`<text x="${X(tv)}" y="${H-7}" text-anchor="${i===0?"start":i===nx?"end":"middle"}" font-size="11" fill="#66727f">${lab}</text>`; }
  if(o.ref!=null && o.ref>y0 && o.ref<y1) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="#9aa7b4" stroke-dasharray="3 3"/>`;
  for(const s of series){
    // 주기가 바뀌는 지점(월간↔주간)은 선을 잇지 않고 구분한다
    const segs=[]; let cur=null;
    for(const p of s.points){ if(!cur||cur.freq!==p.freq){ cur={freq:p.freq,pts:[]}; segs.push(cur);} cur.pts.push(p); }
    for(const sg of segs){
      const d=sg.pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
      const dashed = sg.freq==="M" && state.unit==="W" && !o.nodash;
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${dashed?'stroke-dasharray="4 4"':""} stroke-linejoin="round"/>`;
      if(sg.pts.length===1) g+=`<circle cx="${X(sg.pts[0].t)}" cy="${Y(sg.pts[0].v)}" r="3" fill="${s.color}"/>`;
    }
    if(!o.noflag) for(const p of s.points) if(p.flag==="확인필요") g+=`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="#fff" stroke="#c27a00" stroke-width="2"/>`;
    const lp=s.points[s.points.length-1]; g+=`<circle cx="${X(lp.t)}" cy="${Y(lp.v)}" r="3.5" fill="${s.color}"/>`;
  }
  g+=`<line id="cur" y1="${m.t}" y2="${H-m.b}" stroke="#003766" stroke-opacity=".35" style="display:none"/>`;
  g+=`<rect class="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  const svg=el.querySelector("svg"), hit=svg.querySelector(".hit"), cur=svg.querySelector("#cur"), tip=$("tip");
  hit.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W, tv=x0+(px-m.l)/(W-m.l-m.r)*(x1-x0);
    const rows=series.map(s=>{ let b=null; for(const p of s.points) if(!b||Math.abs(p.t-tv)<Math.abs(b.t-tv)) b=p; return b&&{s,p:b}; }).filter(Boolean);
    if(!rows.length) return;
    const anchor=rows.reduce((a,b)=>Math.abs(a.p.t-tv)<Math.abs(b.p.t-tv)?a:b);
    cur.setAttribute("x1",X(anchor.p.t)); cur.setAttribute("x2",X(anchor.p.t)); cur.style.display="";
    tip.innerHTML=`<b>${anchor.p.label||anchor.p.date}</b><br>`+rows.map(({s,p})=>`<span style="color:${s.color==="#003766"?"#8cc8ee":s.color}">●</span> ${s.name}: ${o.tipFmt?o.tipFmt(p):fmt(p.v)}${p.flag==="확인필요"?" ⚠":""}${p.freq==="M"&&state.unit==="W"?" (월간값)":""}`).join("<br>");
    tip.style.display="block"; const pr=el.closest(".panel").getBoundingClientRect();
    tip.style.left=(e.clientX-pr.left+16+window.scrollX*0)+"px"; tip.style.top=(e.clientY-pr.top+10)+"px";
    if(tip.parentElement!==el.closest(".panel")) el.closest(".panel").appendChild(tip);
  });
  hit.addEventListener("mouseleave",()=>{tip.style.display="none";cur.style.display="none"});
}

// ───────── 화면 그리기 ─────────
const UL={W:["전주","4주 전","1년 전"],M:["전월","3개월 전","전년 동월"],Y:["전년","2년 전",null]};
function deltas(code, pts){
  if(!pts.length) return [null,null,null];
  const last=pts[pts.length-1];
  const all = state.unit==="W"?seriesOf(code):viewAll(code);
  const idx=all.findIndex(p=>p.t===last.t), cur=last.v;
  if(state.unit==="W"){
    const near=(ms,tol)=>{ let b=null; for(const p of all) if(p.t<=ms+tol && p.t>=ms-tol && (!b||Math.abs(p.t-ms)<Math.abs(b.t-ms))) b=p; return b; };
    const prev=all[idx-1], w4=near(last.t-28*DAY,4*DAY), y1=near(last.t-364*DAY,9*DAY);
    return [pct(cur,prev&&prev.v),pct(cur,w4&&w4.v),pct(cur,y1&&y1.v)];
  }
  const back=n=>all[idx-n];
  if(state.unit==="M") return [pct(cur,back(1)&&back(1).v),pct(cur,back(3)&&back(3).v),pct(cur,back(12)&&back(12).v)];
  return [pct(cur,back(1)&&back(1).v),pct(cur,back(2)&&back(2).v),null];
}
function viewAll(code){ // 보기 단위 평균을 전체 기간으로 계산(증감 비교용)
  const keep=[state.from,state.to]; state.from=0; state.to=8e15; const v=view(code); [state.from,state.to]=keep; return v;
}
function render(){
  const idx=state.idx.filter(i=>i.index_code!=="RIR").sort((a,b)=>a.sort_order-b.sort_order);
  const latestAll=Math.max(...state.rows.map(r=>t(r.date)));
  $("meta").textContent=`데이터 최신 기준일 ${iso(latestAll)}`+(state.log.length?` · 마지막 수집 ${state.log[state.log.length-1].run_at}`:"");
  // 카드
  let cards="", charts="", cmp=[];
  for(const ix of idx){
    const pts=view(ix.index_code), last=pts[pts.length-1], d=deltas(ix.index_code,pts), lb=UL[state.unit];
    const raw=inRange(seriesOf(ix.index_code));
    const hi=raw.length?raw.reduce((a,b)=>b.v>a.v?b:a):null, lo=raw.length?raw.reduce((a,b)=>b.v<a.v?b:a):null;
    cards+=`<div class="card" style="--c:${ix.color}"><h3>${ix.display_name}</h3>
      <div class="big">${last?fmt(last.v):"-"}</div><div class="asof">${last?last.label:"선택 기간에 데이터 없음"}${last&&last.flag==="확인필요"?' <span class="warn">⚠ 확인필요</span>':""}</div>
      <div class="deltas">${lb.map((l,i)=>l?`<div class="d">${l} 대비${pctHTML(d[i])}</div>`:"").join("")}</div>
      <div class="hl">${hi?`기간 최고 ${fmt(hi.v)} (${hi.date}) · 최저 ${fmt(lo.v)} (${lo.date})`:""}</div></div>`;
    charts+=`<div class="panel"><h2>${ix.display_name.split(" (")[0]} 추이 <span class="sub">${state.unit==="W"?"주간":state.unit==="M"?"월 평균":"연 평균"}</span></h2><div id="ch_${ix.index_code}"></div></div>`;
    cmp.push({ix,pts});
  }
  $("cards").innerHTML=cards; $("charts").innerHTML=charts;
  for(const {ix,pts} of cmp){
    lineChart($("ch_"+ix.index_code),[{name:ix.index_code,color:ix.color,points:pts}],{dec:ix.index_code==="BAI"?0:0});
  }
  // 상대 비교(첫 값=100)
  // 지수마다 데이터 시작일이 다르므로, 선택 기간에서 모든 지수가 데이터를 가진 첫 날짜(공통 시작일)를 100으로 맞춘다
  const withData=cmp.filter(c=>c.pts.length), baseT=withData.length?Math.max(...withData.map(c=>c.pts[0].t)):0;
  const rebased=withData.map(({ix,pts})=>{ const use=pts.filter(p=>p.t>=baseT), base=use.length?use[0].v:null;
    return {name:ix.index_code,color:ix.color,points:use.map(p=>({...p,orig:p.v,v:p.v/base*100}))}; }).filter(s=>s.points.length);
  $("cmpSub").textContent=baseT?`공통 시작일(${iso(baseT)}) 값 = 100`:"";
  $("cmpLegend").innerHTML=cmp.map(({ix})=>`<span><i style="background:${ix.color}"></i>${ix.index_code}</span>`).join("");
  lineChart($("cmp"),rebased,{w:980,h:300,dec:0,ref:100,nt:6,tipFmt:p=>`${p.v.toFixed(1)} (원값 ${fmt(p.orig)})`});
  // 참고 지수
  const rir=state.idx.find(i=>i.index_code==="RIR");
  if(rir){
    const all=seriesOf("RIR"), sv=all.slice(-24).map(p=>({...p,label:p.date}));
    $("rirTitle").innerHTML=`${rir.display_name} <span class="sub">월간 · 최근 24개월 (기간 선택과 무관)</span>`;
    lineChart($("rir"),[{name:"RIR",color:rir.color,points:sv}],{w:420,h:300,dec:2,nt:5,noflag:true,nodash:true});
    const nf=all.filter(p=>p.flag==="확인필요").length;
    $("rirNote").innerHTML=(sv.length?`마지막 데이터 ${sv[sv.length-1].date}. `:"")+(nf?`<span class="warn">⚠ 엑셀에서 옮긴 값이 FRED 공개값과 달라 확인 중입니다 (${nf}건).</span>`:"");
  }
  // 표
  const rows=[];
  for(const ix of state.idx){
    const raw=inRange(seriesOf(ix.index_code)); const sv=state.unit==="W"||ix.index_code==="RIR"?raw.map(p=>({...p,label:p.date})):view(ix.index_code);
    const all=state.unit==="W"||ix.index_code==="RIR"?seriesOf(ix.index_code):viewAll(ix.index_code);
    for(const p of sv){ const i=all.findIndex(a=>a.t===p.t); rows.push({...p,code:ix.index_code,chg:i>0?pct(p.v,all[i-1].v):null}); }
  }
  rows.sort((a,b)=>b.t-a.t||a.code.localeCompare(b.code)); state.tableRows=rows;
  $("chgH").textContent=state.unit==="W"?"전주(전회) 대비":state.unit==="M"?"전월 대비":"전년 대비";
  $("tblSub").textContent=`${iso(state.from)} ~ ${iso(state.to)} · ${rows.length}건`;
  drawTable(); drawRaw();
  // 수집 현황
  const bad=state.rows.filter(r=>r.flag==="확인필요").length, last=state.log.slice(-6).reverse();
  $("status").innerHTML=(last.length?last.map(l=>`${l.run_at} · ${l.index_code} · <span class="${l.status==="실패"?"bad":l.status==="경고"?"warn":"ok"}">${l.status}</span>${l.rows_added>0?` (+${l.rows_added})`:""} ${l.message||""}`).join("<br>"):"아직 자동 수집 기록이 없습니다.")
    +`<br><span class="${bad?"warn":""}">확인필요 표시 데이터 ${bad}건 (표의 '표시' 열 참고)</span>`;
  $("src").innerHTML="출처: "+state.idx.map(i=>`<a href="${i.source_url}" target="_blank" rel="noopener">${i.index_code}</a>`).join(" · ");
}
function drawTable(){
  const r=state.tableRows.slice(0,state.shown);
  $("tbody").innerHTML=r.map(p=>`<tr><td>${p.label||p.date}</td><td>${p.code}</td><td>${fmt(p.v)}</td><td>${p.chg==null?"-":(p.chg>0?"+":"")+p.chg.toFixed(1)+"%"}</td><td>${p.freq==="M"?"월간":"주간"}</td><td>${p.flag==="확인필요"?`<span class="warn" title="${(p.note||"").replace(/"/g,"&quot;")}">⚠ 확인필요</span>`:""}</td></tr>`).join("");
  $("more").style.display=state.shown<state.tableRows.length?"":"none";
}

// ───────── 원자료: 화면 표 · 복사 · 엑셀(.xlsx) ─────────
const RAW_CODES=["BAI","SCFI","SEAFI"];
function rawWide(){ // 월~일을 한 주로 묶는다. 같은 주에 같은 지수 값이 둘이면 나중 값을 쓴다.
  const m=new Map();
  for(const c of RAW_CODES) for(const p of inRange(seriesOf(c))){
    const wk=p.t-((new Date(p.t).getUTCDay()+6)%7)*DAY; if(!m.has(wk)) m.set(wk,{wk}); m.get(wk)[c]=p; }
  return [...m.values()].sort((a,b)=>a.wk-b.wk);
}
const RAW_HEAD=["주(월요일 시작)","BAI","SCFI","SEAFI","BAI 기준일","SCFI 기준일","SEAFI 기준일"];
function rawRows(){ return rawWide().map(r=>[{d:r.wk},...RAW_CODES.map(c=>r[c]?r[c].v:null),...RAW_CODES.map(c=>r[c]?{d:r[c].t}:null)]); }
function rawLong(){
  const H=["기준일","지수","값","주기","출처","표시","메모"], out=[H];
  for(const ix of state.idx) for(const p of inRange(seriesOf(ix.index_code)))
    out.push([{d:p.t},ix.index_code,p.v,p.freq==="M"?"월간":"주간",p.origin||"",p.flag==="확인필요"?"확인필요":"",p.note||""]);
  return out;
}
function cellText(c){ return c==null?"":typeof c==="object"?iso(c.d):String(c); }
function drawRaw(){
  const rows=rawRows(); $("rawSub").textContent=`${iso(state.from)} ~ ${iso(state.to)} · ${rows.length}주`;
  $("rawTbl").querySelector("thead").innerHTML="<tr>"+RAW_HEAD.map(h=>`<th>${h}</th>`).join("")+"</tr>";
  $("rawTbl").querySelector("tbody").innerHTML=rows.slice().reverse().map(r=>"<tr>"+r.map((c,i)=>`<td>${i>=1&&i<=3?(c==null?"":fmt(c)):cellText(c)}</td>`).join("")+"</tr>").join("");
}
function rawTSV(){ return [RAW_HEAD,...rawRows()].map(r=>r.map(cellText).join("\t")).join("\n"); }

// 최소 xlsx 생성기(외부 라이브러리 없음): 압축 없는 zip + 시트 XML
const xe=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function sheetXml(rows,widths){
  const col=i=>String.fromCharCode(65+i);
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'
   +widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")+"</cols><sheetData>";
  rows.forEach((r,ri)=>{ x+=`<row r="${ri+1}">`;
    r.forEach((c,ci)=>{ const ref=col(ci)+(ri+1); if(c==null||c==="") return;
      if(ri===0) x+=`<c r="${ref}" t="inlineStr" s="2"><is><t>${xe(c)}</t></is></c>`;
      else if(typeof c==="object") x+=`<c r="${ref}" s="1"><v>${Math.round(c.d/DAY)+25569}</v></c>`;
      else if(typeof c==="number") x+=`<c r="${ref}"><v>${c}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t>${xe(c)}</t></is></c>`; });
    x+="</row>"; });
  return x+"</sheetData></worksheet>";
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const f of files){
    const nm=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(10,0,true); lh.setUint16(12,33,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(14,33,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm); off+=30+nm.length+data.length;
  }
  const csz=cen.reduce((s,a)=>s+a.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csz,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function buildXlsx(){
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"', H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zipStore([
    {name:"[Content_Types].xml",text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:"_rels/.rels",text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",text:H+`<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="원자료(가로)" sheetId="1" r:id="rId1"/><sheet name="원자료(세로)" sheetId="2" r:id="rId2"/></sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml",text:H+`<styleSheet ${NS}><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Malgun Gothic"/></font><font><b/><sz val="11"/><name val="Malgun Gothic"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    {name:"xl/worksheets/sheet1.xml",text:sheetXml([RAW_HEAD,...rawRows()],[18,11,11,11,13,13,13])},
    {name:"xl/worksheets/sheet2.xml",text:sheetXml(rawLong(),[12,9,12,8,8,10,60])}
  ]);
}
function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(txt);
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  const ok=document.execCommand("copy"); ta.remove(); return ok?Promise.resolve():Promise.reject(new Error("복사 실패"));
}

// ───────── 조작 ─────────
function setRange(fromMs,toMs){ state.from=fromMs; state.to=toMs; $("from").value=iso(fromMs); $("to").value=iso(toMs); state.shown=60; render(); }
function init(){
  const latest=Math.max(...state.rows.map(r=>t(r.date))), earliest=Math.min(...state.rows.map(r=>t(r.date)));
  $("from").min=$("to").min=iso(earliest); $("from").max=$("to").max=iso(latest);
  const Q=[["3개월",91],["6개월",182],["1년",365],["전체",0]];
  $("quick").innerHTML=Q.map(([l,d],i)=>`<button data-d="${d}" class="${i===2?"on":""}">${l}</button>`).join("");
  $("unit").innerHTML=[["W","주간"],["M","월간"],["Y","연간"]].map(([k,l])=>`<button data-u="${k}" class="${k===state.unit?"on":""}">${l}</button>`).join("");
  $("quick").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; [...$("quick").children].forEach(x=>x.classList.toggle("on",x===b));
    const d=+b.dataset.d; setRange(d?latest-d*DAY:earliest, latest); };
  $("unit").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.unit=b.dataset.u; [...$("unit").children].forEach(x=>x.classList.toggle("on",x===b));
    if(state.unit==="Y"&&latest-state.from<700*DAY){ [...$("quick").children].forEach(x=>x.classList.toggle("on",x.dataset.d==="0")); setRange(earliest,latest); } else render(); };
  const dateChange=()=>{ if(!$("from").value||!$("to").value) return; [...$("quick").children].forEach(x=>x.classList.remove("on"));
    const a=t($("from").value), b=t($("to").value); if(a>b) return; state.from=a; state.to=b; state.shown=60; render(); };
  $("from").onchange=$("to").onchange=dateChange;
  $("more").onclick=()=>{ state.shown+=100; drawTable(); };
  $("dl").onclick=()=>{
    const head="기준일,지수,값,주기,표시,메모\n"; const body=state.tableRows.slice().reverse().map(p=>[p.date,p.code,p.v,p.freq==="M"?"월간":"주간",p.flag==="확인필요"?"확인필요":"",'"'+(p.note||"").replace(/"/g,'""')+'"'].join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+head+body],{type:"text/csv;charset=utf-8"})); a.download=`운임지수_${iso(state.from)}_${iso(state.to)}.csv`; a.click(); };
  $("rawCopy").onclick=()=>copyText(rawTSV()).then(()=>{ $("rawMsg").textContent="복사했습니다. 엑셀에서 A1 칸을 선택하고 붙여넣기(Ctrl+V) 하세요."; },()=>{ $("rawMsg").textContent="복사하지 못했습니다. 엑셀 파일 내려받기를 이용해 주세요."; });
  $("rawXlsx").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(buildXlsx()); a.download=`운임지수_원자료_${iso(state.from)}_${iso(state.to)}.xlsx`; a.click(); $("rawMsg").textContent="엑셀 파일을 내려받았습니다."; };
  $("fetchBtn").onclick=async()=>{
    const btn=$("fetchBtn"), msg=$("fetchMsg"); btn.disabled=true; msg.textContent="가져오는 중…";
    try{
      const r=await fetch("api/collect?v="+Date.now()); if(!r.ok) throw new Error("이 주소에서는 수집 기능을 쓸 수 없습니다 (HTTP "+r.status+")");
      const j=await r.json(), oldLatest=Math.max(...state.rows.map(x=>t(x.date))); let added=0; const bad=[];
      for(const code of ["BAI","SCFI","SEAFI"]){
        if(j.errors&&j.errors[code]){ bad.push(code); continue; }
        for(const [date,val] of (j[code]||[])){
          if(state.rows.some(x=>x.index_code===code&&x.date===date)) continue;
          state.rows.push({date,index_code:code,value:String(val),frequency:"W",origin:"화면수집",flag:"",note:"화면에서 가져옴(저장소에는 미반영)"}); added++; }
      }
      const newLatest=Math.max(...state.rows.map(x=>t(x.date)));
      $("from").max=$("to").max=iso(newLatest);
      if(state.to>=oldLatest) { state.to=newLatest; $("to").value=iso(newLatest); }
      render();
      msg.textContent=(added?`새 값 ${added}건을 반영했습니다. `:"새 값이 없습니다(이미 최신). ")+(bad.length?`가져오지 못한 지수: ${bad.join(", ")}. `:"")+(added?"이 화면에서만 보이며, 아래 '원자료'에서 엑셀로 내려받을 수 있습니다.":"");
    }catch(e){ msg.textContent="실패: "+e.message; }
    btn.disabled=false;
  };
  setRange(latest-365*DAY, latest);
}
(async()=>{
  try{
    const [rows,idx,log]=await Promise.all([load("data/index_values.csv"),load("data/indices.csv"),load("data/collect_log.csv",true)]);
    state.rows=rows; state.idx=idx.map(i=>({...i,sort_order:+i.sort_order})); state.log=log;
    $("app").style.display=""; init();
  }catch(e){
    $("err").style.display="block";
    $("err").innerHTML="데이터 파일을 불러오지 못했습니다. 파일을 더블클릭해서 열면 브라우저 보안 때문에 보이지 않습니다. 게시된 웹 주소로 열어 주세요.<br><small>"+e+"</small>"; $("meta").textContent="";
  }
})();
</script>
